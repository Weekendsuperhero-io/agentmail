name: CI Agent Mail

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: weekendsuperhero-io/platform-tools/.github/workflows/reusable-rust-ci.yml@b77434bbb0713493c85a155570421f2153bfba7a
    with:
      check-os-json: '["ubuntu-latest","macos-latest","windows-latest"]'
      rust-cache-provider: github
      docs-os: ubuntu-latest
      build-matrix-json: "[]"
      # A prebuilt cargo-nextest runs the tests with the `ci` profile
      # (.config/nextest.toml), on every OS, with no fallback: a failure is a
      # failure. nextest skips doctests, so `cargo test --doc` runs them.
      install-nextest: true
      test-command: cargo nextest run --locked --all-features --profile ci && cargo test --doc --locked --all-features
