name: Nightly stress tests

on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-stress
  cancel-in-progress: true

jobs:
  header-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Run 216K-message cache stress test
        run: >-
          cargo test --locked --all-features --lib
          header_cache::tests::large_mailbox_snapshot_uses_bounded_chunk_writes
          -- --ignored --exact
