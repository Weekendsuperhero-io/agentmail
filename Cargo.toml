[workspace]

# Local imap-proto fork adding RFC 9586 UIDFETCH response parsing (the enabler
# for Yahoo/AOL UID Mode / ENABLE UIDONLY, which lifts the visible-window
# limit). Applies to async-imap's transitive imap-proto too. See
# docs/patches/imap-proto-uidfetch.md; upstream when possible to drop the fork.
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }

[package]
name = "agentmail"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
description = "IMAP email client, MCP server, and CLI — read, search, delete, unsubscribe, and manage mailboxes"
documentation = "https://docs.rs/agentmail"
readme = "README.md"
homepage = "https://github.com/weekendsuperhero-io/agentmail"
repository = "https://github.com/weekendsuperhero-io/agentmail"
license = "Apache-2.0"
keywords = ["agent", "email", "imap", "mail", "mcp"]
categories = ["email", "network-programming"]

[lib]
name = "agentmail"
path = "src/lib.rs"

[[bin]]
name = "agentmail"
path = "src/main.rs"

[dependencies]
# IMAP protocol (tokio runtime). `compress` enables optional RFC 4978
# COMPRESS=DEFLATE, negotiated after login only when the server advertises it.
# It materially reduces transfer size for large full-header scans.
async-imap = { version = "0.11", default-features = false, features = [
  "runtime-tokio",
  "compress",
] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fast_html2md = "0.0"
futures = "0.3"
hashbrown = { version = "0.17", features = ["rayon", "serde"] }
idna = "1"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
mail-parser = "0.11"
mail-auth = { version = "0.11.2", default-features = false, features = ["ring"] }
native-tls = "0.2"
parking_lot = "0.12"
percent-encoding = "2"
psl = "2"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "=2.2.0", features = ["server", "macros", "transport-io"] }
# Held at 0.39 (libsqlite3-sys ^0.37) so embedding workspaces that also carry
# sqlx-sqlite 0.9 (libsqlite3-sys >=0.30.1,<0.38) can converge on one native
# sqlite — libsqlite3-sys has `links = "sqlite3"`, so exactly one version may
# exist in any dependency graph. Bump together with the embedder's sqlx.
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
schemars = { version = "1.2", features = ["chrono04"] }
keyring-core = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
tokio-util = "0.7"
toml = "1.1"
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[lints.clippy]
await_holding_lock = "deny"
cloned_instead_of_copied = "warn"
doc_markdown = "allow"
inefficient_to_string = "warn"
large_stack_arrays = "deny"
manual_let_else = "allow"
manual_string_new = "warn"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"

[dev-dependencies]
proptest = "1"
mail-parser = "0.11"
# oauth_token example only (loopback PKCE flow to mint an access token).
rand = "0.10"
