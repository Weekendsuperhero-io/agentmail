[workspace]

# Local imap-proto 0.17 fork adding RFC 9586 UIDFETCH response parsing (the
# enabler for Yahoo/AOL UID Mode / ENABLE UIDONLY, which lifts the
# visible-window limit). Applies to async-imap's transitive imap-proto too. See
# docs/patches/imap-proto-uidfetch.md; upstream when possible to drop the fork.
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }

[package]
name = "heromail"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
description = "HeroMail IMAP email client, MCP server, and CLI — read, search, delete, unsubscribe, and manage mailboxes"
documentation = "https://docs.rs/heromail"
readme = "README.md"
exclude = ["/.claude/"]
repository = "https://github.com/weekendsuperhero-io/heromail"
license = "Apache-2.0"
keywords = ["agent", "email", "imap", "mail", "mcp"]
categories = ["email", "network-programming"]

[lib]
name = "heromail"
path = "src/lib.rs"

[[bin]]
name = "heromail"
path = "src/main.rs"

[dependencies]
# IMAP protocol (tokio runtime). `compress` enables optional RFC 4978
# COMPRESS=DEFLATE, negotiated after login only when the server advertises it.
# It materially reduces transfer size for large full-header scans.
async-imap = { version = "0.12", default-features = false, features = [
  "runtime-tokio",
  "compress",
] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
fast_html2md = "0.0"
futures = "0.3"
hashbrown = { version = "0.17", features = ["rayon", "serde"] }
idna = "1"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
mail-parser = "1.0.2"
# aws-lc-rs, not ring: HERO links this crate and ships one rustls crypto
# provider. mail-auth 0.16 uses the same aws-lc-sys 0.47 as aws-lc-rs 1.19.
mail-auth = { version = "0.16", default-features = false, features = ["aws-lc-rs", "rustls-platform-verifier"] }
parking_lot = "0.13"
percent-encoding = "2"
printpdf = { version = "0.12", default-features = false }
psl = "2"
reqwest = { version = "0.13", features = ["json"] }
# Exact-pinned to the HERO workspace's rmcp, so the app links
# one copy. The protocol does not move with the SDK: the server speaks up to
# `mcp::MAX_PROTOCOL_VERSION` (2026-07-28), named in the source.
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-io"] }
# On 0.43 (libsqlite3-sys ^0.40; RUSTSEC-2026-0459 is fixed from 0.39) since
# sqlx-sqlite 0.9.1 accepts libsqlite3-sys below 0.41.
# libsqlite3-sys has `links = "sqlite3"`, so exactly one version may exist in
# any dependency graph: an embedding workspace that also carries sqlx-sqlite
# must converge on it. Bump together with the embedder's sqlx.
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
schemars = { version = "1.2", features = ["chrono04"] }
keyring-core = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# IMAP's TLS. rustls on aws-lc-rs, the one crypto provider HERO ships
# (`tokio_rustls::rustls` is the rustls this uses, so the two can't drift),
# with the certificate check handed to the OS by rustls-platform-verifier,
# so the roots a person or their MDM installed still count. native-tls ran
# Secure Transport on macOS, which never gained TLS 1.3, and OpenSSL on Linux.
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
tokio-util = "0.7"
toml = "1.2"
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-async-io-crypto-rust"] }

[lints.clippy]
await_holding_lock = "deny"
cloned_instead_of_copied = "warn"
doc_markdown = "allow"
inefficient_to_string = "warn"
large_stack_arrays = "deny"
manual_let_else = "allow"
manual_string_new = "warn"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"

[dev-dependencies]
proptest = "1"
mail-parser = "1.0.2"
# oauth_token example only (loopback PKCE flow to mint an access token).
rand = "0.10"
